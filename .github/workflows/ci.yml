name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  qualidade:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: teste
          POSTGRES_USER: teste
          POSTGRES_PASSWORD: teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teste -d teste"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://teste:teste@localhost:5432/teste?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Lint
        # compilado com o Go do projeto (a versão pronta do lint é mais antiga que o go.mod)
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          "$(go env GOPATH)/bin/golangci-lint" run

      - name: Testes com detector de corrida
        run: go test -race ./...

      - name: Cobertura mínima de 80% em domínio e aplicação
        run: |
          go test -coverprofile=cover.out ./internal/domain/... ./internal/application/...
          total=$(go tool cover -func=cover.out | awk '/^total:/ {gsub("%","",$3); print $3}')
          echo "Cobertura total: ${total}%"
          awk -v t="$total" 'BEGIN { if (t+0 < 80) { print "Cobertura abaixo de 80%"; exit 1 } }'
